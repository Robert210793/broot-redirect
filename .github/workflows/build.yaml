name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Generate coverage report
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator "-reports:Broot.Redirect.Tests/coverage.xml" "-targetdir:coverage-summary" "-reporttypes:MarkdownSummaryGithub"
          cat coverage-summary/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          # Check if current commit already has a version tag
          EXISTING=$(git tag --points-at HEAD | grep '^v' | sort -V | tail -1)
          if [ -n "$EXISTING" ]; then
            echo "Current commit already tagged: $EXISTING — skipping bump"
            echo "new_version=${EXISTING#v}" >> "$GITHUB_OUTPUT"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and create tag
        if: steps.version.outputs.skipped != 'true'
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Set final version
        id: final_version
        run: |
          if [ "${{ steps.version.outputs.skipped }}" = "true" ]; then
            echo "version=${{ steps.version.outputs.new_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.bump.outputs.new_version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Final version: $(cat "$GITHUB_OUTPUT" | grep version | cut -d= -f2)"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.final_version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.final_version.outputs.version }}