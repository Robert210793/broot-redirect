@if (isOpen()) {
    <div
        class="modal-backdrop"
        (click)="onBackdropClick($event)"
        (keydown)="onKeydown($event)"
    >
        <div class="modal-content" role="dialog" aria-labelledby="password-modal-title">
            <div class="modal-header">
                <h2 id="password-modal-title" class="modal-title">Administrator-Anmeldung</h2>
                <button
                    class="btn btn-ghost btn-icon modal-close"
                    (click)="onClose()"
                    [disabled]="isLoading()"
                    aria-label="Schließen"
                >
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <p class="modal-description">Bitte gib das Administrator-Passwort ein:</p>

            <div class="modal-body">
                <div class="form-group">
                    <input
                        type="password"
                        class="form-input"
                        placeholder="Passwort eingeben"
                        [(ngModel)]="password"
                        [disabled]="isLoading()"
                        (keydown.enter)="onSubmit()"
                        autofocus
                    />
                </div>

                @if (errorMessage()) {
                    <div class="alert alert-danger">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
                            <line x1="12" y1="9" x2="12" y2="13" />
                            <line x1="12" y1="17" x2="12.01" y2="17" />
                        </svg>
                        <span>{{ errorMessage() }}</span>
                    </div>
                }

                <div class="modal-actions">
                    <button
                        class="btn btn-primary modal-action-btn"
                        (click)="onSubmit()"
                        [disabled]="isLoading() || !password.trim()"
                    >
                        @if (isLoading()) {
                            <span class="spinner"></span>
                            Anmelden...
                        } @else {
                            Anmelden
                        }
                    </button>
                    <button
                        class="btn btn-secondary modal-action-btn"
                        (click)="onClose()"
                        [disabled]="isLoading()"
                    >
                        Abbrechen
                    </button>
                </div>
            </div>
        </div>
    </div>
}
